name: nirikshak-vit

services:
  # ============================================
  # PostgreSQL - Primary Relational Database
  # ============================================
  # We are using a remote Neon DB, so local Postgres is disabled.
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: nirikshak-postgres-vit
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-nirikshak}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nirikshak_dev_password}
  #     POSTGRES_DB: ${POSTGRES_DB:-nirikshak_db}
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nirikshak} -d ${POSTGRES_DB:-nirikshak_db}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ============================================
  # ChromaDB - Vector Database for RAG
  # ============================================
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: nirikshak-chromadb-vit
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ============================================
  # Redis - Task Queue Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: nirikshak-redis-vit
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MinIO - Object Storage (S3-compatible)
  # ============================================
  # minio:
  #   image: quay.io/minio/minio:latest
  #   container_name: nirikshak-minio-vit
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
  #   ports:
  #     - "${MINIO_PORT:-9000}:9000"
  #     - "${MINIO_CONSOLE_PORT:-9001}:9001"
  #   volumes:
  #     - minio_data:/data

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nirikshak-vit-backend:latest
    container_name: nirikshak-backend-vit
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - ./rag_documetns:/app/rag_documents:ro
      - paddleocr_data:/root/.paddleocr
    depends_on:
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  # ============================================
  # Celery Worker - Background Task Processing
  # ============================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nirikshak-vit-worker:latest
    container_name: nirikshak-worker-vit
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./rag_documetns:/app/rag_documents:ro
      - paddleocr_data:/root/.paddleocr
    depends_on:
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

volumes:
  pg_data:
  chroma_data:
  redis_data:
  minio_data:
  paddleocr_data:
